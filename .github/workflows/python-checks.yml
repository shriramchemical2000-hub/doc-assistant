name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy requests
      - name: Compile Python modules
        run: python -m compileall -q app.py config.py src tests
      - name: Run unit tests
        run: pytest -q
